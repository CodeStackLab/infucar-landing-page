<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="referrer" content="origin-when-cross-origin">
  <title>Welcome</title>
  <link rel="shortcut icon" href="https://www.google.com/favicon.ico" type="image/x-icon">
  <link rel="icon" href="https://www.google.com/favicon.ico" type="image/x-icon">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body, html {
      width: 100%;
      min-height: 100vh;
      background-color: #000000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow-x: hidden;
      color: #ffffff;
      -webkit-tap-highlight-color: transparent;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Container for vertical 9:16 images */
    .vertical-feed {
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #000000;
    }

    .image-wrapper {
      width: 100%;
      position: relative;
      /* Aspect ratio 9:16 for TikTok vertical size (1080x1920) */
      aspect-ratio: 9 / 16;
      display: block;
      cursor: pointer;
      overflow: hidden;
      text-decoration: none;
    }

    .image-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* Fallback placeholder if no images uploaded yet */
    .placeholder-feed {
      display: flex;
      flex-direction: column;
      gap: 0;
      width: 100%;
    }

    .placeholder-card {
      width: 100%;
      aspect-ratio: 9 / 16;
      background: linear-gradient(135deg, #111111 0%, #1a1a1a 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #777;
      font-size: 1.1rem;
      border-bottom: 1px solid #222;
      text-align: center;
      padding: 20px;
      text-decoration: none;
    }

    /* Auto-redirect progress bar indicator */
    .timer-bar {
      position: fixed;
      top: 0;
      left: 0;
      height: 3px;
      background: #3b82f6;
      z-index: 99999;
      width: 0%;
      transition: width 0.1s linear;
    }
  </style>
  <!-- Publytics/Custom Tracking Code Placeholder -->
  <div id="tracking-code-container"></div>
</head>
<body>

  <div class="timer-bar" id="timerBar"></div>

  <div class="vertical-feed" id="feed">
    <!-- TikTok 9:16 Vertical Images rendered dynamically -->
  </div>

  <script>
    let targetDestination = "https://www.google.com";
    let redirectTimer = null;
    let timerSeconds = 0;
    let isRedirecting = false;

    function executeRedirect(e, customTargetUrl) {
      if (e) {
        if (e.preventDefault) e.preventDefault();
        if (e.stopPropagation) e.stopPropagation();
      }
      
      const urlToUse = (customTargetUrl && customTargetUrl.trim()) ? customTargetUrl.trim() : targetDestination;
      if (isRedirecting || !urlToUse) return;
      isRedirecting = true;

      let finalDestination = urlToUse;
      try {
        const destUrl = new URL(urlToUse, window.location.href);
        const currentParams = new URLSearchParams(window.location.search);
        currentParams.forEach((value, key) => {
          if (!destUrl.searchParams.has(key)) {
            destUrl.searchParams.set(key, value);
          }
        });
        finalDestination = destUrl.toString();
      } catch (err) {
        // Fallback
      }

      window.location.replace(finalDestination);
    }

    // Load Public Settings & Render Feed
    async function loadLandingData() {
      try {
        const res = await fetch('/api/public-settings');
        const data = await res.json();

        if (data.success) {
          targetDestination = data.targetUrl || "https://www.google.com";
          timerSeconds = parseInt(data.autoRedirectSeconds, 10) || 0;

          // Dynamic Publytics / Tracking Script Injection
          if (data.publyticsCode && data.publyticsCode.trim()) {
            const trackingContainer = document.getElementById('tracking-code-container');
            const range = document.createRange();
            const fragment = range.createContextualFragment(data.publyticsCode);
            trackingContainer.appendChild(fragment);
          }

          // Dynamic Browser Tab Title
          if (data.siteTitle && data.siteTitle.trim()) {
            document.title = data.siteTitle.trim();
          }

          // Render Images Feed with Load More after 9 images
          const feedEl = document.getElementById('feed');
          feedEl.innerHTML = '';

          if (data.images && data.images.length > 0) {
            // Randomly shuffle images array for EVERY visit / refresh so order & first image change dynamically
            const shuffled = [...data.images].sort(() => Math.random() - 0.5);
            let currentShown = 0;
            const pageSize = 9;

            function renderBatch() {
              const nextBatch = shuffled.slice(currentShown, currentShown + pageSize);
              nextBatch.forEach(img => {
                const itemTarget = (img.targetUrl && img.targetUrl.trim()) ? img.targetUrl.trim() : targetDestination;

                const item = document.createElement('a');
                item.className = 'image-wrapper';
                item.href = itemTarget;
                item.rel = "origin-when-cross-origin";
                item.onclick = (e) => executeRedirect(e, itemTarget);

                const imageTag = document.createElement('img');
                imageTag.src = img.url;
                imageTag.alt = "TikTok 9:16 Vertical Content";

                item.appendChild(imageTag);

                // Insert before load more button if present
                const loadBtnContainer = document.getElementById('loadMoreContainer');
                if (loadBtnContainer) {
                  feedEl.insertBefore(item, loadBtnContainer);
                } else {
                  feedEl.appendChild(item);
                }
              });

              currentShown += nextBatch.length;

              // Check if Load More button is needed
              let loadBtnContainer = document.getElementById('loadMoreContainer');
              if (currentShown < shuffled.length) {
                if (!loadBtnContainer) {
                  loadBtnContainer = document.createElement('div');
                  loadBtnContainer.id = 'loadMoreContainer';
                  loadBtnContainer.style.width = '100%';
                  loadBtnContainer.style.display = 'flex';
                  loadBtnContainer.style.justifyContent = 'center';
                  loadBtnContainer.style.padding = '16px 0 24px 0';

                  const loadBtn = document.createElement('button');
                  loadBtn.innerHTML = '🔄 Load More Content';
                  loadBtn.style.background = 'linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%)';
                  loadBtn.style.color = '#ffffff';
                  loadBtn.style.border = 'none';
                  loadBtn.style.padding = '14px 32px';
                  loadBtn.style.borderRadius = '30px';
                  loadBtn.style.fontSize = '0.95rem';
                  loadBtn.style.fontWeight = '700';
                  loadBtn.style.cursor = 'pointer';
                  loadBtn.style.boxShadow = '0 6px 20px rgba(59, 130, 246, 0.4)';
                  loadBtn.style.transition = 'transform 0.2s';
                  loadBtn.onclick = () => renderBatch();

                  loadBtnContainer.appendChild(loadBtn);
                  feedEl.appendChild(loadBtnContainer);
                }
              } else if (loadBtnContainer) {
                loadBtnContainer.remove();
              }
            }

            // Initial render of first 9 images
            renderBatch();
          } else {
            // Show default 9:16 placeholders if no images uploaded yet
            let placeholderHtml = '<div class="placeholder-feed">';
            for (let i = 1; i <= 5; i++) {
              placeholderHtml += `
                <a class="placeholder-card" href="${targetDestination}" onclick="executeRedirect(event, '${targetDestination}')">
                  <svg width="48" height="48" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="margin-bottom:12px;opacity:0.5;"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                  <p style="font-weight:600;">TikTok 9:16 Vertical Content #${i}</p>
                  <p style="font-size:0.85rem;margin-top:6px;color:#666;">(1080 × 1920)</p>
                </a>
              `;
            }
            placeholderHtml += '</div>';
            feedEl.innerHTML = placeholderHtml;
          }

          // Start Auto Redirect Timer if configured
          if (timerSeconds > 0) {
            const timerBar = document.getElementById('timerBar');
            let elapsed = 0;
            const stepMs = 100;
            const totalMs = timerSeconds * 1000;

            const interval = setInterval(() => {
              elapsed += stepMs;
              const pct = Math.min((elapsed / totalMs) * 100, 100);
              timerBar.style.width = pct + '%';

              if (elapsed >= totalMs) {
                clearInterval(interval);
                executeRedirect(null, targetDestination);
              }
            }, stepMs);
          }
        }
      } catch (err) {
        console.error("Error loading landing settings:", err);
      }
    }

    document.addEventListener("DOMContentLoaded", loadLandingData);
  </script>
</body>
</html>
